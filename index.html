---
layout: default
---
<section class="intro">
  <p>I'm Kyle. I write about freelancing, working for myself, and what I learn along the way.</p>
</section>

<section>
  <h2 class="section-title">Posts</h2>
  <ul class="post-list">
    {% for post in site.posts %}
      <li><span class="date">{{ post.date | date: "%b %-d, %Y" }}</span><a class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
    {% else %}
      <li>Your first post is coming soon.</li>
    {% endfor %}
  </ul>
</section>
