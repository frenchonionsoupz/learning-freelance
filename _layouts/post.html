---
layout: default
---
<article>
  <a class="back-link" href="{{ '/' | relative_url }}">← All posts</a>
  <h1 class="article-title">{{ page.title | escape }}</h1>
  {% if page.subtitle %}<p class="article-subtitle">{{ page.subtitle | escape }}</p>{% endif %}
  <p class="article-date">{{ page.date | date: "%b %-d, %Y" }}</p>
  {% if page.image %}<img class="featured-image" src="{{ page.image | relative_url }}" alt="" loading="eager" decoding="async">{% endif %}
  <div class="article-content">{{ content }}</div>
</article>
