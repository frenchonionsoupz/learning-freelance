<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfbf7">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}Learning Freelance</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}A personal blog about freelancing, working for myself, and what I learn along the way.{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="Learning Freelance RSS" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header>
      <a href="{{ '/' | relative_url }}" class="brand" aria-label="Learning Freelance home">learning<span class="accent">freelance</span><span class="dot">.</span></a>
    </header>
    <main>{{ content }}</main>
    <section class="subscribe-box" aria-labelledby="subscribe-heading">
      <p class="subscribe-label" id="subscribe-heading">Get new posts by email</p>
      <p class="subscribe-copy">New writing, most days.</p>
      <div class="kit-embed" id="kit-signup">
        <script async data-uid="ab42a40fe0" src="https://learning-freelance.kit.com/ab42a40fe0/index.js"></script>
      </div>
    </section>
    <footer>© {{ site.time | date: "%Y" }} Learning Freelance · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
  </div>
</body>
</html>
