name: Create Kit newsletter drafts
on:
  push:
    branches: [main]
    paths:
      - '_posts/*.md'
      - '_posts/*.markdown'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML Markdown
      - name: Draft newsletters for new posts only
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: python scripts/kit_newsletter.py
